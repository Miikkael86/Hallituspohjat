name: Päivitä kannatusluvut

on:
  schedule:
    - cron: "17 6 * * *"   # joka päivä klo 6.17 UTC
  workflow_dispatch:        # voi ajaa myös käsin Actions-välilehdeltä

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: pip install beautifulsoup4==4.12.3

      - name: Hae uusimmat mittaukset
        run: python scripts/update_polls.py polls.json

      - name: Tallenna muutokset
        run: |
          if git diff --quiet polls.json; then
            echo "Ei uusia mittauksia."
            exit 0
          fi
          git config user.name "hallituspohjat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polls.json
          git commit -m "Päivitä kannatusluvut $(date -u +%Y-%m-%d)"
          git push
